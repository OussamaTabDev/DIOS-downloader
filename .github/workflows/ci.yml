# DIOS Downloader — continuous integration
#
# The "Build DIOS Downloader" workflow (build.yml) already compiles Windows
# and runs the engine tests there on every push. This workflow adds what it
# does not cover: the workspace tests on Linux, on the same ubuntu-22.04
# image the release packages are built on.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tests
        run: cargo test --workspace
