[package]
name = "dios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DIOS Downloader – download manager (desktop app)"
build = "build.rs"

[dependencies]
dios-engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# ~1.18: the winit accessor (unstable-winit-030) belongs to this Slint line
slint = { version = "~1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
tiny_http = "0.12"
arboard = { version = "3", default-features = false }
rfd = "0.15"
open = "5"
url = "2"
chrono = "0.4"
sha2 = "0.10"
tokio-util = "0.7"
sys-locale = "0.3"

[build-dependencies]
slint-build = "~1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# headless screenshot renderer (UI design tool, not used by the app itself)
shot = ["slint/renderer-software"]

[[bin]]
name = "DIOSDownloader"
path = "src/main.rs"

# renders the real .slint windows headlessly with mock data, saving PNGs
# (cargo run -p dios --features shot --bin dios-shot -- main 0 out.png)
[[bin]]
name = "dios-shot"
path = "src/bin/shot.rs"
required-features = ["shot"]

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Ole",
] }
