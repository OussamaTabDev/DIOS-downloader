[package]
name = "batiie"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Batiie – download manager (desktop app, htmx interface)"
build = "build.rs"

[dependencies]
batiie-engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }

# the interface: a small local web server that answers htmx requests with
# server-rendered HTML fragments (maud checks and escapes the markup)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form"] }
maud = { version = "0.27", features = ["axum"] }
rand = "0.8"

tiny_http = "0.12"   # the browser add-in's API (api.rs)
arboard = { version = "3", default-features = false }
rfd = "0.15"
open = "5"
url = "2"
chrono = "0.4"
sha2 = "0.10"
sys-locale = "0.3"

# the native window around the interface (WebView2 on Windows, WebKitGTK on
# Linux). Without it the interface opens in the default browser instead.
wry = { version = "0.52", optional = true }
tao = { version = "0.34", optional = true }

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["window"]
window = ["dep:wry", "dep:tao"]

[[bin]]
name = "Batiie"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
] }

# Linux/BSD: the icon next to the clock is a StatusNotifierItem (KDE, GNOME with
# the AppIndicator extension, XFCE, Cinnamon, MATE, Budgie, ...) – pure Rust, no GTK
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
